// ── Helpers ───────────────────────────────────────────────────────
const fmt = n => "₪" + Number(n||0).toLocaleString("he-IL");
const uid = () => Math.random().toString(36).slice(2);
const nowKey = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; };
const monthLabel = key => {
  if (!key) return "";
  const [y,m] = key.split("-");
  const months=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
  return `${months[parseInt(m)-1]} ${y}`;
};
const prevMonthKey = key => {
  const [y,m] = key.split("-").map(Number);
  const d = new Date(y, m-2, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
};
const nextMonthKey = key => {
  const [y,m] = key.split("-").map(Number);
  const d = new Date(y, m, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
};
const getAllExpCats = () => EXPENSE_CATS.reduce((a,c)=>c.isGroup?[...a,...c.children]:[...a,c],[]);

// ── Calculate month balance ───────────────────────────────────────
const calcMonthBalance = (monthData, bizRecords, monthKey, debts) => {
  const m = monthData || {};
  const inc = INCOME_CATS.reduce((s,c)=>s+(m[`inc_${c.id}`]||0),0);
  const expCats = getAllExpCats();
  const exp = expCats.reduce((s,c)=>s+(m[`exp_${c.id}`]||0),0);
  const biz = (bizRecords||[]).filter(r=>r.date?.startsWith(monthKey))
    .reduce((s,r)=>s+(r.type==="income"?r.amount:-r.amount),0);
  return inc + biz - exp;
};

// ── Apply monthly interest to debts ──────────────────────────────
const applyMonthlyInterest = (debts, fromKey, toKey) => {
  return debts.map(d => {
    if (!d.interestRate || d.interestRate <= 0) return d;
    const remaining = d.total - d.paid;
    if (remaining <= 0) return d;
    const monthlyRate = d.interestRate / 100;
    const interest = remaining * monthlyRate;
    return { ...d, total: d.total + interest };
  });
};

// ── State ─────────────────────────────────────────────────────────
let appData = JSON.parse(JSON.stringify(INITIAL));
let currentPage = "dashboard";
let currentMonth = nowKey();
let authenticated = !!sessionStorage.getItem("af_auth");
let saving = false;
let unsubscribe = null;

// ── Firebase ──────────────────────────────────────────────────────
async function saveToFirebase(data) {
  if (saving) return;
  saving = true;
  try { await setDoc(doc(db, "budget", "shared"), data); } catch(e) { console.error(e); }
  saving = false;
}

function startSync() {
  if (unsubscribe) unsubscribe();
  unsubscribe = onSnapshot(doc(db, "budget", "shared"), snap => {
    if (snap.exists()) {
      appData = { ...INITIAL, ...snap.data() };
    } else {
      saveToFirebase(appData);
    }
    render();
  });
}

function updateData(updater) {
  appData = typeof updater === "function" ? updater(appData) : updater;
  saveToFirebase(appData);
  render();
}

// ── Carry-over balance to next month ─────────────────────────────
function getCarryOver(monthKey) {
  const prev = prevMonthKey(monthKey);
  const prevBalance = calcMonthBalance(appData.months[prev], appData.businessRecords, prev, appData.debts);
  const prevCarry = appData.months[prev]?.carryOver || 0;
  return prevBalance + prevCarry;
}

}

// ── DASHBOARD ─────────────────────────────────────────────────────
function renderDashboard(container) {
  const month = appData.months[currentMonth] || {};
  const inc = INCOME_CATS.reduce((s,c)=>s+(month[`inc_${c.id}`]||0),0);
  const expCats = getAllExpCats();
  const exp = expCats.reduce((s,c)=>s+(month[`exp_${c.id}`]||0),0);
  const biz = appData.businessRecords.filter(r=>r.date?.startsWith(currentMonth))
    .reduce((s,r)=>s+(r.type==="income"?r.amount:-r.amount),0);
  const carryOver = getCarryOver(currentMonth);
  const balance = inc + biz - exp;
  const totalWithCarry = balance + carryOver;
  const totalGoals = appData.goals.reduce((s,g)=>s+(appData.goalValues[g.id]||0),0);
  const totalTarget = appData.goals.reduce((s,g)=>s+g.target,0);
  const totalDebt = appData.debts.reduce((s,d)=>s+(d.total-d.paid),0);

  container.innerHTML = `
  <div style="text-align:center;margin-bottom:20px">
    <div style="color:rgba(255,255,255,0.5);font-size:13px;margin-bottom:4px">מאזן חודשי — ${monthLabel(currentMonth)}</div>
    <div style="font-size:44px;font-weight:bold;color:${balance>=0?"#34d399":"#f87171"}">${fmt(balance)}</div>
    ${carryOver!==0?`<div style="color:rgba(255,255,255,0.4);font-size:13px;margin-top:4px">כולל יתרה מחודש קודם: <span style="color:#fbbf24">${fmt(totalWithCarry)}</span></div>`:""}
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
    ${[
      {label:"הכנסות",val:inc+biz,color:"#34d399",icon:"⬇️"},
      {label:"הוצאות",val:exp,color:"#f87171",icon:"⬆️"},
      {label:"חיסכון ויעדים",val:totalGoals,color:"#fbbf24",icon:"🎯"},
      {label:"יתרת חוב",val:totalDebt,color:"#fb923c",icon:"⚠️"},
    ].map(({label,val,color,icon})=>`
      <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:14px">
        <div style="font-size:18px;margin-bottom:6px">${icon}</div>
        <div style="color:${color};font-weight:bold;font-size:20px">${fmt(val)}</div>
        <div style="color:rgba(255,255,255,0.4);font-size:11px;margin-top:4px">${label}</div>
      </div>`).join("")}
  </div>
  <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:16px">
    <div style="color:rgba(255,255,255,0.5);font-size:13px;margin-bottom:12px">יעדים (${fmt(totalGoals)} מתוך ${fmt(totalTarget)})</div>
    <div style="height:6px;background:rgba(255,255,255,0.1);border-radius:9999px;overflow:hidden;margin-bottom:12px">
      <div style="height:100%;width:${Math.min(100,(totalGoals/totalTarget)*100)}%;background:linear-gradient(to right,#fbbf24,#34d399);border-radius:9999px"></div>
    </div>
    ${appData.goals.map(g=>{
      const cur=appData.goalValues[g.id]||0;
      const pct=Math.min(100,(cur/g.target)*100);
      return `<div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:3px">

          <div style="height:100%;width:${pct}%;background:${g.color};border-radius:9999px"></div>

    }).join("")}

            ${c.label}${c.bimonthly?`<span style="color:#fbbf24;font-size:10px;margin-right:4px">(דו-חודשי)</span>`:""}
          </label>
          ${numInput(`exp_${c.id}`,month[`exp_${c.id}`])}
        </div>
        ${c.bimonthly?`<div style="color:rgba(255,255,255,0.3);font-size:11px;margin-top:2px">הכנס מחצית מהחשבון</div>`:""}
        ${c.hasNote?`<input type="text" placeholder="פירוט..." value="${month[`exp_${c.id}_note`]||""}"
          onchange="window.setBudgetNote('exp_${c.id}_note',this.value)"
          style="width:100%;margin-top:4px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:6px 12px;color:rgba(255,255,255,0.6);font-size:12px;outline:none;box-sizing:border-box" dir="rtl" />`:""}
      </div>`;
    }
  });
  html += `</div>`;
  container.innerHTML = html;

  window.setBudgetDebt = (debtId) => {
    updateData(d=>({...d,months:{...d.months,[currentMonth]:{...(d.months[currentMonth]||{}),debtPaymentId:debtId}}}));
  };
}

// ── CHECKING (auto-sync from budget) ──────────────────────────────
function renderChecking(container) {
  const month = appData.months[currentMonth] || {};
  const carryOver = getCarryOver(currentMonth);

  // Auto-calculated from budget
  const budgetInc = INCOME_CATS.reduce((s,c)=>s+(month[`inc_${c.id}`]||0),0);
  const expCats = getAllExpCats();
  const budgetExp = expCats.reduce((s,c)=>s+(month[`exp_${c.id}`]||0),0);
  const biz = appData.businessRecords.filter(r=>r.date?.startsWith(currentMonth))
    .reduce((s,r)=>s+(r.type==="income"?r.amount:-r.amount),0);

  // Manual entries
  const entries = month.checking || [];
  const manualIn = entries.filter(e=>e.type==="income").reduce((s,e)=>s+e.amount,0);
  const manualOut = entries.filter(e=>e.type==="expense").reduce((s,e)=>s+e.amount,0);

  const totalIn = budgetInc + biz + manualIn;
  const totalOut = budgetExp + manualOut;
  const balance = totalIn - totalOut + carryOver;
  const locLabels = {account:"חשבון בנק",cash:"מזומן",savings_account:"חסכון",other:"אחר"};

  window.addChecking = () => {
    const label = el("ch-label")?.value;
    const amount = parseFloat(el("ch-amount")?.value)||0;
    const type = el("ch-type")?.value;
    const location = el("ch-loc")?.value;
    const note = el("ch-note")?.value;
    if (!label || !amount) return;
    const entry = {id:uid(),label,amount,type,location,note,date:new Date().toISOString().slice(0,10)};
    updateData(d=>({...d,months:{...d.months,[currentMonth]:{...(d.months[currentMonth]||{}),checking:[...(d.months[currentMonth]?.checking||[]),entry]}}}));
  };
  window.removeChecking = id => {
    updateData(d=>({...d,months:{...d.months,[currentMonth]:{...(d.months[currentMonth]||{}),checking:(d.months[currentMonth]?.checking||[]).filter(e=>e.id!==id)}}}));
  };

  container.innerHTML = `
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px">
    ${[
      {label:"כניסות",val:totalIn,color:"#34d399"},
      {label:"יציאות",val:totalOut,color:"#f87171"},
      {label:"יתרה",val:balance,color:balance>=0?"#fbbf24":"#f87171"},
    ].map(({label,val,color})=>`
      <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px;text-align:center">
        <div style="color:${color};font-weight:bold;font-size:16px">${fmt(val)}</div>
        <div style="color:rgba(255,255,255,0.4);font-size:11px">${label}</div>
      </div>`).join("")}
  </div>
  ${carryOver!==0?`<div style="background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.2);border-radius:12px;padding:10px;font-size:13px;color:#fbbf24;margin-bottom:12px">
    יתרה מחודש קודם: ${fmt(carryOver)}</div>`:""}
  <div style="background:rgba(52,211,153,0.08);border:1px solid rgba(52,211,153,0.15);border-radius:12px;padding:12px;margin-bottom:16px">
    <div style="color:rgba(255,255,255,0.5);font-size:12px;margin-bottom:6px">מתקציב החודש</div>
    <div style="display:flex;justify-content:space-between;font-size:13px">
      <span style="color:#34d399">הכנסות: ${fmt(budgetInc+biz)}</span>
      <span style="color:#f87171">הוצאות: ${fmt(budgetExp)}</span>
    </div>
  </div>
  <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:16px;margin-bottom:16px">
    <div style="color:white;font-weight:600;margin-bottom:12px">הוסף תנועה ידנית</div>
    <input id="ch-label" type="text" placeholder="תיאור..." dir="rtl"
      style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px 12px;color:white;font-size:14px;outline:none;margin-bottom:8px;box-sizing:border-box" />
    <input id="ch-amount" type="number" placeholder="סכום" dir="ltr"
      style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px 12px;color:white;font-size:14px;outline:none;margin-bottom:8px;box-sizing:border-box" />
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
      <select id="ch-type" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px;color:white;font-size:13px;outline:none">
        <option value="income">הכנסה</option>
        <option value="expense">הוצאה</option>
      </select>
      <select id="ch-loc" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px;color:white;font-size:13px;outline:none" dir="rtl">
        <option value="account">חשבון בנק</option>
        <option value="cash">מזומן</option>
        <option value="savings_account">חסכון</option>
        <option value="other">אחר</option>
      </select>
    </div>
    <input id="ch-note" type="text" placeholder="הערה..." dir="rtl"
      style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px 12px;color:rgba(255,255,255,0.6);font-size:13px;outline:none;margin-bottom:8px;box-sizing:border-box" />
    <button onclick="window.addChecking()" style="width:100%;padding:10px;background:#fbbf24;color:#1e1b4b;font-weight:bold;border:none;border-radius:12px;cursor:pointer">הוסף</button>
  </div>
  ${entries.length>0?`<div>
    <div style="color:rgba(255,255,255,0.4);font-size:12px;margin-bottom:8px">תנועות ידניות</div>
    ${entries.map(e=>`
      <div style="display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px;margin-bottom:8px">
        <div style="width:8px;height:8px;border-radius:50%;flex-shrink:0;background:${e.type==="income"?"#34d399":"#f87171"}"></div>
        <div style="flex:1">
          <div style="color:white;font-size:14px">${e.label}</div>
          ${e.note?`<div style="color:rgba(255,255,255,0.4);font-size:12px">${e.note}</div>`:""}
          <div style="color:rgba(255,255,255,0.3);font-size:11px">${locLabels[e.location]||""} · ${e.date}</div>
        </div>
        <div style="color:${e.type==="income"?"#34d399":"#f87171"};font-weight:600">${e.type==="income"?"+":"-"}${fmt(e.amount)}</div>
        <button onclick="window.removeChecking('${e.id}')" style="color:rgba(255,255,255,0.2);background:none;border:none;cursor:pointer">🗑</button>
      </div>`).join("")}
  </div>`:""}`;
}

// ── ASSETS ────────────────────────────────────────────────────────
function renderAssets(container) {
  const totalAssets = appData.assets.reduce((s,a)=>{
    const records = appData.assetValues[a.id]||[];
    return s+(records[records.length-1]?.amount||0);
  },0);

  window.updateAsset = id => {
    const amountEl = el(`asset-amount-${id}`);
    const amount = parseFloat(amountEl?.value)||0;
    if (!amount) return;
    const location = el(`asset-loc-${id}`)?.value;
    const note = el(`asset-note-${id}`)?.value;
    const record = {id:uid(),amount,location,note,date:new Date().toISOString().slice(0,10)};
    updateData(d=>({...d,assetValues:{...d.assetValues,[id]:[...(d.assetValues[id]||[]),record]}}));
  };
  window.addAsset = () => {
    const label = el("new-asset")?.value.trim();
    if (!label) return;
    updateData(d=>({...d,assets:[...d.assets,{id:uid(),label,custom:true}]}));
    if(el("new-asset")) el("new-asset").value="";
  };
  window.removeAsset = id => updateData(d=>({...d,assets:d.assets.filter(a=>a.id!==id)}));

  let html = `
  <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:16px;text-align:center;margin-bottom:16px">
    <div style="color:rgba(255,255,255,0.5);font-size:13px;margin-bottom:4px">סה״כ נכסים</div>
    <div style="color:#fbbf24;font-weight:bold;font-size:40px">${fmt(totalAssets)}</div>
  </div>`;

  appData.assets.forEach(a => {
    const records = appData.assetValues[a.id]||[];
    const last = records[records.length-1];
    const prev = records[records.length-2];
    const change = last && prev ? last.amount - prev.amount : 0;
    html += `
    <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:16px;margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div style="color:white;font-weight:500">${a.label}</div>
        ${a.custom?`<button onclick="window.removeAsset('${a.id}')" style="color:rgba(255,255,255,0.2);background:none;border:none;cursor:pointer">🗑</button>`:""}
      </div>
      ${last?`
        <div style="color:#34d399;font-weight:bold;font-size:24px">${fmt(last.amount)}</div>
        <div style="color:rgba(255,255,255,0.4);font-size:12px;margin-top:2px">${last.date}
          ${change!==0?`<span style="color:${change>0?"#34d399":"#f87171"};margin-right:8px">${change>0?"+":""}${fmt(change)}</span>`:""}
        </div>
        ${last.note?`<div style="color:rgba(255,255,255,0.4);font-size:12px">${last.note}</div>`:""}
        ${records.length>1?`<div style="color:rgba(255,255,255,0.3);font-size:11px;margin-top:4px">${records.length} עדכונים | ערך קודם: ${fmt(prev?.amount)}</div>`:""}
      `:`<div style="color:rgba(255,255,255,0.3);font-size:13px">אין נתון עדיין</div>`}
      <div style="margin-top:12px;border-top:1px solid rgba(255,255,255,0.08);padding-top:12px">
        <input id="asset-amount-${a.id}" type="number" placeholder="שווי חדש (לא ימחק קודם)" dir="ltr"
          style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px;color:white;font-size:13px;outline:none;margin-bottom:6px;box-sizing:border-box" />
        <select id="asset-loc-${a.id}" style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px;color:white;font-size:13px;outline:none;margin-bottom:6px" dir="rtl">
          <option value="account">חשבון בנק</option>
          <option value="fund">קרן השקעות</option>
          <option value="pension">פנסיה</option>
          <option value="property">נכס נדל״ן</option>
          <option value="cash">מזומן</option>
          <option value="other">אחר</option>
        </select>
        <input id="asset-note-${a.id}" type="text" placeholder="הערה..." dir="rtl"
          style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px;color:rgba(255,255,255,0.6);font-size:13px;outline:none;margin-bottom:6px;box-sizing:border-box" />
        <button onclick="window.updateAsset('${a.id}')" style="width:100%;padding:8px;background:rgba(251,191,36,0.2);color:#fbbf24;border:1px solid rgba(251,191,36,0.4);border-radius:10px;cursor:pointer;font-size:13px">הוסף עדכון</button>
      </div>
    </div>`;
  });

  html += `
  <div style="background:rgba(255,255,255,0.05);border:1px dashed rgba(255,255,255,0.2);border-radius:16px;padding:16px">
    <input id="new-asset" type="text" placeholder="שם הנכס החדש..." dir="rtl"
      style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px 12px;color:white;font-size:14px;outline:none;margin-bottom:8px;box-sizing:border-box" />
    <button onclick="window.addAsset()" style="width:100%;padding:8px;background:rgba(255,255,255,0.1);color:rgba(255,255,255,0.6);border:none;border-radius:10px;cursor:pointer">+ הוסף נכס</button>
  </div>`;
  container.innerHTML = html;
}

// ── GOALS ─────────────────────────────────────────────────────────
function renderGoals(container) {
  const COLORS=["#4ade80","#60a5fa","#f472b6","#fb923c","#a78bfa","#34d399","#fbbf24","#f87171"];
  const totalSaved = appData.goals.reduce((s,g)=>s+(appData.goalValues[g.id]||0),0);
  const totalTarget = appData.goals.reduce((s,g)=>s+g.target,0);

  window.updateGoalAmount = (id,val) => updateData(d=>({...d,goalValues:{...d.goalValues,[id]:parseFloat(val)||0}}));
  window.updateGoalTarget = (id,val) => updateData(d=>({...d,goals:d.goals.map(g=>g.id===id?{...g,target:parseFloat(val)||0}:g)}));
  window.updateGoalColor = (id,color) => updateData(d=>({...d,goals:d.goals.map(g=>g.id===id?{...g,color}:g)}));
  window.removeGoal = id => updateData(d=>({...d,goals:d.goals.filter(g=>g.id!==id)}));
  window.addGoal = () => {
    const label = el("new-goal-label")?.value.trim();
    const target = parseFloat(el("new-goal-target")?.value)||0;
    if (!label) return;
    updateData(d=>({...d,goals:[...d.goals,{id:uid(),label,target,color:"#60a5fa"}]}));
    if(el("new-goal-label")) el("new-goal-label").value="";
    if(el("new-goal-target")) el("new-goal-target").value="";
  };

  let html = `
  <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:16px;text-align:center;margin-bottom:16px">
    <div style="color:rgba(255,255,255,0.5);font-size:13px;margin-bottom:4px">סה״כ נחסך</div>
    <div style="color:#fbbf24;font-weight:bold;font-size:40px">${fmt(totalSaved)}</div>
    <div style="color:rgba(255,255,255,0.3);font-size:13px;margin-top:4px">מתוך יעד ${fmt(totalTarget)}</div>
    <div style="height:8px;background:rgba(255,255,255,0.1);border-radius:9999px;overflow:hidden;margin-top:12px">
      <div style="height:100%;width:${Math.min(100,(totalSaved/totalTarget)*100)}%;background:linear-gradient(to right,#fbbf24,#34d399);border-radius:9999px"></div>
    </div>
  </div>`;

  appData.goals.forEach(g => {
    const saved = appData.goalValues[g.id]||0;
    const pct = Math.min(100,(saved/g.target)*100);
    html += `
    <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:16px;margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <div style="width:12px;height:12px;border-radius:50%;background:${g.color}"></div>
        <div style="color:white;font-weight:500;flex:1">${g.label}</div>
        <button onclick="window.removeGoal('${g.id}')" style="color:rgba(255,255,255,0.2);background:none;border:none;cursor:pointer">🗑</button>
      </div>
      <div style="height:6px;background:rgba(255,255,255,0.1);border-radius:9999px;overflow:hidden;margin-bottom:4px">
        <div style="height:100%;width:${pct}%;background:${g.color};border-radius:9999px"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:12px">
        <span>${pct.toFixed(0)}%</span><span>${fmt(saved)} / ${fmt(g.target)}</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
        <div>
          <div style="color:rgba(255,255,255,0.4);font-size:11px;margin-bottom:4px">נחסך</div>
          <input type="number" value="${saved}" onchange="window.updateGoalAmount('${g.id}',this.value)"
            style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px;color:white;font-size:13px;outline:none;box-sizing:border-box" dir="ltr" />
        </div>
        <div>
          <div style="color:rgba(255,255,255,0.4);font-size:11px;margin-bottom:4px">יעד</div>
          <input type="number" value="${g.target}" onchange="window.updateGoalTarget('${g.id}',this.value)"
            style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px;color:white;font-size:13px;outline:none;box-sizing:border-box" dir="ltr" />
        </div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${COLORS.map(c=>`<button onclick="window.updateGoalColor('${g.id}','${c}')" style="width:22px;height:22px;border-radius:50%;background:${c};border:${g.color===c?"3px solid white":"2px solid transparent"};cursor:pointer"></button>`).join("")}
      </div>
    </div>`;
  });

  html += `
  <div style="background:rgba(255,255,255,0.05);border:1px dashed rgba(255,255,255,0.2);border-radius:16px;padding:16px">
    <div style="color:white;font-weight:600;margin-bottom:12px">הוסף יעד חדש</div>
    <input id="new-goal-label" type="text" placeholder="שם היעד..." dir="rtl"
      style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px 12px;color:white;font-size:14px;outline:none;margin-bottom:8px;box-sizing:border-box" />
    <input id="new-goal-target" type="number" placeholder="סכום יעד" dir="ltr"
      style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px 12px;color:white;font-size:14px;outline:none;margin-bottom:8px;box-sizing:border-box" />
    <button onclick="window.addGoal()" style="width:100%;padding:10px;background:#fbbf24;color:#1e1b4b;font-weight:bold;border:none;border-radius:12px;cursor:pointer">הוסף יעד</button>
  </div>`;
  container.innerHTML = html;
}

// ── BUSINESS ──────────────────────────────────────────────────────
function renderBusiness(container) {
  const records = appData.businessRecords.filter(r=>r.date?.startsWith(currentMonth));
  const income = records.filter(r=>r.type==="income").reduce((s,r)=>s+r.amount,0);
  const expense = records.filter(r=>r.type==="expense").reduce((s,r)=>s+r.amount,0);
  const net = income - expense;

  window.addBizRecord = () => {
    const type = el("biz-type")?.value;
    const category = el("biz-cat")?.value;
    const amount = parseFloat(el("biz-amount")?.value)||0;
    const note = el("biz-note")?.value;
    const date = el("biz-date")?.value;
    if (!amount) return;
    updateData(d=>({...d,businessRecords:[...d.businessRecords,{id:uid(),type,category,amount,note,date}]}));
  };
  window.removeBiz = id => updateData(d=>({...d,businessRecords:d.businessRecords.filter(r=>r.id!==id)}));

  container.innerHTML = `
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px">
    ${[
      {label:"הכנסות",val:income,color:"#34d399"},
      {label:"הוצאות",val:expense,color:"#f87171"},
      {label:"רווח נקי",val:net,color:net>=0?"#fbbf24":"#f87171"},
    ].map(({label,val,color})=>`
      <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px;text-align:center">
        <div style="color:${color};font-weight:bold;font-size:16px">${fmt(val)}</div>
        <div style="color:rgba(255,255,255,0.4);font-size:11px">${label}</div>
      </div>`).join("")}
  </div>
  ${net>0?`<div style="background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.2);border-radius:12px;padding:10px;font-size:13px;color:#34d399;margin-bottom:12px">
    ✅ ${fmt(net)} מועבר לעו״ש החודש</div>`:""}
  <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:16px;margin-bottom:16px">
    <div style="color:white;font-weight:600;margin-bottom:12px">הוסף רשומה</div>
    <select id="biz-type" style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px;color:white;font-size:13px;outline:none;margin-bottom:8px" dir="rtl">
      <option value="income">הכנסה</option>
      <option value="expense">הוצאה</option>
    </select>
    <input id="biz-cat" type="text" placeholder="קטגוריה..." dir="rtl"
      style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px 12px;color:white;font-size:13px;outline:none;margin-bottom:8px;box-sizing:border-box" />
    <input id="biz-amount" type="number" placeholder="סכום" dir="ltr"
      style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px 12px;color:white;font-size:13px;outline:none;margin-bottom:8px;box-sizing:border-box" />
    <input id="biz-date" type="date" value="${new Date().toISOString().slice(0,10)}"
      style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px 12px;color:white;font-size:13px;outline:none;margin-bottom:8px;box-sizing:border-box" />
    <input id="biz-note" type="text" placeholder="הערה..." dir="rtl"
      style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px 12px;color:rgba(255,255,255,0.6);font-size:13px;outline:none;margin-bottom:8px;box-sizing:border-box" />
    <button onclick="window.addBizRecord()" style="width:100%;padding:10px;background:#fbbf24;color:#1e1b4b;font-weight:bold;border:none;border-radius:12px;cursor:pointer">הוסף</button>
  </div>
  <div>
    ${records.length===0?`<div style="text-align:center;color:rgba(255,255,255,0.3);padding:24px">אין רשומות לחודש זה</div>`:""}
    ${records.map(r=>`
      <div style="display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px;margin-bottom:8px">
        <div style="width:8px;height:8px;border-radius:50%;flex-shrink:0;background:${r.type==="income"?"#34d399":"#f87171"}"></div>
        <div style="flex:1">
          <div style="color:white;font-size:14px">${r.category||r.type}</div>
          ${r.note?`<div style="color:rgba(255,255,255,0.4);font-size:12px">${r.note}</div>`:""}
          <div style="color:rgba(255,255,255,0.3);font-size:11px">${r.date}</div>
        </div>
        <div style="color:${r.type==="income"?"#34d399":"#f87171"};font-weight:600">${r.type==="income"?"+":"-"}${fmt(r.amount)}</div>
        <button onclick="window.removeBiz('${r.id}')" style="color:rgba(255,255,255,0.2);background:none;border:none;cursor:pointer">🗑</button>
      </div>`).join("")}
  </div>`;
}

// ── DEBTS ─────────────────────────────────────────────────────────
function renderDebts(container) {
  const totalDebt = appData.debts.reduce((s,d)=>s+(d.total-d.paid),0);
  const totalMonthly = appData.debts.reduce((s,d)=>s+(d.monthly||0),0);

  window.addDebt = () => {
    const label = el("debt-label")?.value.trim();
    const total = parseFloat(el("debt-total")?.value)||0;
    const paid = parseFloat(el("debt-paid")?.value)||0;
    const monthly = parseFloat(el("debt-monthly")?.value)||0;
    const interestRate = parseFloat(el("debt-interest")?.value)||0;
    const note = el("debt-note")?.value;
    if (!label) return;
    updateData(d=>({...d,debts:[...d.debts,{id:uid(),label,total,paid,monthly,interestRate,note}]}));
    ["debt-label","debt-total","debt-paid","debt-monthly","debt-interest","debt-note"].forEach(id=>{if(el(id))el(id).value="";});
  };
  window.updateDebtPaid = (id,val) => {
    const debt = appData.debts.find(d=>d.id===id);
    if (!debt) return;
    const newPaid = parseFloat(val)||0;
    const diff = newPaid - debt.paid;
    updateData(d=>({...d,debts:d.debts.map(debt=>debt.id===id?{...debt,paid:newPaid}:debt)}));
  };
  window.applyInterest = () => {
    updateData(d=>({...d,debts:applyMonthlyInterest(d.debts, null, null)}));
  };
  window.removeDebt = id => updateData(d=>({...d,debts:d.debts.filter(debt=>debt.id!==id)}));

  let html = `
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
    <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:14px;text-align:center">
      <div style="color:#f87171;font-weight:bold;font-size:22px">${fmt(totalDebt)}</div>
      <div style="color:rgba(255,255,255,0.4);font-size:12px">סה״כ חוב</div>
    </div>
    <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:14px;text-align:center">
      <div style="color:#fb923c;font-weight:bold;font-size:22px">${fmt(totalMonthly)}</div>
      <div style="color:rgba(255,255,255,0.4);font-size:12px">תשלום חודשי</div>
    </div>
  </div>
  <button onclick="window.applyInterest()" style="width:100%;padding:10px;background:rgba(251,191,36,0.15);color:#fbbf24;border:1px solid rgba(251,191,36,0.3);border-radius:12px;cursor:pointer;font-size:13px;margin-bottom:16px">
    📈 החל ריבית חודשית על כל החובות
  </button>`;

  appData.debts.forEach(debt => {
    const remaining = debt.total - debt.paid;
    const pct = Math.min(100,(debt.paid/debt.total)*100);
    const months = debt.monthly>0 ? Math.ceil(remaining/debt.monthly) : null;
    const monthlyInterest = debt.interestRate ? (remaining * debt.interestRate / 100) : 0;
    html += `
    <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:16px;margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div style="color:white;font-weight:500">${debt.label}</div>
        <button onclick="window.removeDebt('${debt.id}')" style="color:rgba(255,255,255,0.2);background:none;border:none;cursor:pointer">🗑</button>
      </div>
      <div style="height:6px;background:rgba(255,255,255,0.1);border-radius:9999px;overflow:hidden;margin-bottom:4px">
        <div style="height:100%;width:${pct}%;background:linear-gradient(to right,#f87171,#fb923c);border-radius:9999px"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:12px">
        <span>שולם: ${fmt(debt.paid)}</span>
        <span>נותר: ${fmt(remaining)}</span>
        <span>סה״כ: ${fmt(debt.total)}</span>
      </div>
      ${debt.interestRate?`<div style="color:#fb923c;font-size:12px;margin-bottom:8px">ריבית חודשית: ${debt.interestRate}% = ${fmt(monthlyInterest)}</div>`:""}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
        <div>
          <div style="color:rgba(255,255,255,0.4);font-size:11px;margin-bottom:4px">סה״כ שולם</div>
          <input type="number" value="${debt.paid}" onchange="window.updateDebtPaid('${debt.id}',this.value)"
            style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px;color:white;font-size:13px;outline:none;box-sizing:border-box" dir="ltr" />
        </div>
        <div>
          <div style="color:rgba(255,255,255,0.4);font-size:11px;margin-bottom:4px">תשלום חודשי</div>
          <input type="number" value="${debt.monthly}" onchange="window.updateDebtMonthly('${debt.id}',this.value)"
            style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px;color:white;font-size:13px;outline:none;box-sizing:border-box" dir="ltr" />
        </div>
      </div>
      ${months?`<div style="text-align:center;color:rgba(255,255,255,0.3);font-size:12px">≈ ${months} חודשים לסיום</div>`:""}
      ${debt.note?`<div style="color:rgba(255,255,255,0.3);font-size:12px;margin-top:4px">${debt.note}</div>`:""}
    </div>`;
  });

  window.updateDebtMonthly = (id,val) => updateData(d=>({...d,debts:d.debts.map(debt=>debt.id===id?{...debt,monthly:parseFloat(val)||0}:debt)}));

  html += `
  <div style="background:rgba(255,255,255,0.05);border:1px dashed rgba(255,255,255,0.2);border-radius:16px;padding:16px">
    <div style="color:white;font-weight:600;margin-bottom:12px">הוסף חוב</div>
    <input id="debt-label" type="text" placeholder="שם החוב..." dir="rtl"
      style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px 12px;color:white;font-size:14px;outline:none;margin-bottom:8px;box-sizing:border-box" />
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
      <input id="debt-total" type="number" placeholder="סכום כולל" dir="ltr"
        style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px;color:white;font-size:13px;outline:none;box-sizing:border-box" />
      <input id="debt-paid" type="number" placeholder="כבר שולם" dir="ltr"
        style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px;color:white;font-size:13px;outline:none;box-sizing:border-box" />
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
      <input id="debt-monthly" type="number" placeholder="תשלום חודשי" dir="ltr"
        style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px;color:white;font-size:13px;outline:none;box-sizing:border-box" />
      <input id="debt-interest" type="number" placeholder="ריבית % לחודש" dir="ltr" step="0.1"
        style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px;color:white;font-size:13px;outline:none;box-sizing:border-box" />
    </div>
    <input id="debt-note" type="text" placeholder="הערה..." dir="rtl"
      style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px 12px;color:rgba(255,255,255,0.6);font-size:13px;outline:none;margin-bottom:8px;box-sizing:border-box" />
    <button onclick="window.addDebt()" style="width:100%;padding:10px;background:#fbbf24;color:#1e1b4b;font-weight:bold;border:none;border-radius:12px;cursor:pointer">הוסף חוב</button>
  </div>`;
  container.innerHTML = html;
}

// ── STATS ─────────────────────────────────────────────────────────
function renderStats(container) {
  // Get last 6 months
  const months = [];
  let key = currentMonth;
  for (let i=0; i<6; i++) {
    months.unshift(key);
    key = prevMonthKey(key);
  }

  const monthData = months.map(mk => {
    const m = appData.months[mk] || {};
    const inc = INCOME_CATS.reduce((s,c)=>s+(m[`inc_${c.id}`]||0),0);
    const expCats = getAllExpCats();
    const exp = expCats.reduce((s,c)=>s+(m[`exp_${c.id}`]||0),0);
    const biz = appData.businessRecords.filter(r=>r.date?.startsWith(mk))
      .reduce((s,r)=>s+(r.type==="income"?r.amount:-r.amount),0);
    const balance = inc + biz - exp;

    // Category breakdown
    const food = (m["exp_food_supermarket"]||0)+(m["exp_food_extras"]||0)+(m["exp_food_outside"]||0);
    const car = (m["exp_car_payment"]||0)+(m["exp_car_insurance"]||0)+(m["exp_car_repair"]||0)+(m["exp_car_fuel"]||0);
    const housing = (m["exp_rent"]||0)+(m["exp_electricity"]||0)+(m["exp_water"]||0)+(m["exp_gas"]||0)+(m["exp_arnona"]||0)+(m["exp_vaad_bayit"]||0);

    return {mk, inc:inc+biz, exp, balance, food, car, housing};
  });

  const maxVal = Math.max(...monthData.map(d=>Math.max(d.inc,d.exp)), 1);

  const bar = (val, color, maxV) => {
    const h = Math.max(4, (val/maxV)*120);
    return `<div style="width:100%;background:${color};border-radius:4px 4px 0 0;height:${h}px;min-height:4px"></div>`;
  };

  container.innerHTML = `
  <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:16px;margin-bottom:16px">
    <div style="color:white;font-weight:600;margin-bottom:16px">הכנסות מול הוצאות — 6 חודשים</div>
    <div style="display:flex;align-items:flex-end;gap:4px;height:140px;margin-bottom:8px">
      ${monthData.map(d=>`
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px">
          ${bar(d.inc,"#34d399",maxVal)}
          ${bar(d.exp,"#f87171",maxVal)}
        </div>`).join("")}
    </div>
    <div style="display:flex;gap:4px">
      ${monthData.map(d=>`<div style="flex:1;text-align:center;color:rgba(255,255,255,0.4);font-size:9px">${monthLabel(d.mk).split(" ")[0]}</div>`).join("")}
    </div>
    <div style="display:flex;gap:16px;margin-top:12px;font-size:12px">
      <span style="color:#34d399">■ הכנסות</span>
      <span style="color:#f87171">■ הוצאות</span>
    </div>
  </div>

  <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:16px;margin-bottom:16px">
    <div style="color:white;font-weight:600;margin-bottom:12px">מאזן חודשי</div>
    ${monthData.map(d=>`
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <div style="color:rgba(255,255,255,0.5);font-size:12px;width:50px;flex-shrink:0">${monthLabel(d.mk).split(" ")[0]}</div>
        <div style="flex:1;height:8px;background:rgba(255,255,255,0.1);border-radius:9999px;overflow:hidden">
          <div style="height:100%;width:${d.balance>=0?Math.min(100,(d.balance/maxVal)*100):0}%;background:#34d399;border-radius:9999px"></div>
        </div>
        <div style="color:${d.balance>=0?"#34d399":"#f87171"};font-size:12px;width:70px;text-align:left">${fmt(d.balance)}</div>
      </div>`).join("")}
  </div>

  <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:16px;margin-bottom:16px">
    <div style="color:white;font-weight:600;margin-bottom:12px">פירוט הוצאות עיקריות — ${monthLabel(currentMonth)}</div>
    ${[
      {label:"דיור",val:monthData[monthData.length-1].housing,color:"#60a5fa"},
      {label:"אוכל",val:monthData[monthData.length-1].food,color:"#34d399"},
      {label:"רכב",val:monthData[monthData.length-1].car,color:"#fb923c"},
    ].map(({label,val,color})=>{
      const pct = monthData[monthData.length-1].exp>0 ? (val/monthData[monthData.length-1].exp)*100 : 0;
      return `<div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
          <span style="color:rgba(255,255,255,0.7)">${label}</span>
          <span style="color:${color}">${fmt(val)} (${pct.toFixed(0)}%)</span>
        </div>
        <div style="height:8px;background:rgba(255,255,255,0.1);border-radius:9999px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${color};border-radius:9999px"></div>
        </div>
      </div>`;
    }).join("")}
  </div>

  <div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:16px">
    <div style="color:white;font-weight:600;margin-bottom:12px">טבלת סיכום</div>
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <tr style="color:rgba(255,255,255,0.4)">
          <th style="text-align:right;padding:4px 8px">חודש</th>
          <th style="text-align:left;padding:4px 8px">הכנסות</th>
          <th style="text-align:left;padding:4px 8px">הוצאות</th>
          <th style="text-align:left;padding:4px 8px">מאזן</th>
        </tr>
        ${monthData.map(d=>`
          <tr style="border-top:1px solid rgba(255,255,255,0.06)">
            <td style="padding:6px 8px;color:rgba(255,255,255,0.6)">${monthLabel(d.mk)}</td>
            <td style="padding:6px 8px;color:#34d399">${fmt(d.inc)}</td>
            <td style="padding:6px 8px;color:#f87171">${fmt(d.exp)}</td>
            <td style="padding:6px 8px;color:${d.balance>=0?"#34d399":"#f87171"}">${fmt(d.balance)}</td>
          </tr>`).join("")}
      </table>
    </div>
  </div>`;
}

// ── INIT ──────────────────────────────────────────────────────────
if (authenticated) startSync();
else render();
</script>
